<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IBI Product Listings Master — App</title>
<meta name="description" content="One product record in, marketplace-ready listings out: Amazon India, Amazon Bazaar, Flipkart, Shopsy, Meesho, ShopClues, IBI Marketplace and more, with dynamic SEO and compliance checks.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="India Business International">
<meta property="og:title" content="IBI Product Listings Master">
<meta property="og:description" content="List once, sell everywhere. Marketplace-ready listings for Amazon, Flipkart, Meesho, Shopsy, ShopClues and your own store, with dynamic SEO.">
<meta property="og:url" content="https://listingsmaster.indiabusinessinternational.online/app/">
<meta property="og:image" content="https://listingsmaster.indiabusinessinternational.online/og-banner.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:type" content="image/png">
<meta property="og:image:alt" content="IBI Product Listings Master">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="IBI Product Listings Master">
<meta name="twitter:description" content="List once, sell everywhere. Marketplace-ready listings with dynamic SEO.">
<meta name="twitter:image" content="https://listingsmaster.indiabusinessinternational.online/og-banner.png">
<meta name="theme-color" content="#6d28d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
<script>try{var t=localStorage.getItem('plm:theme');if(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');var ts=localStorage.getItem('plm:ts');if(ts)document.documentElement.style.setProperty('--ts',ts);}catch(e){}</script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <span class="badge-ver" id="versionBadge" title="App version — tap for About">v1.1.3</span>
    <a class="brand" href="#/dashboard"><span class="mark">PL</span><span>Listings Master <small>by IBI</small></span></a>
    <div class="search" role="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="globalSearch" type="search" placeholder="Search products, SKUs, keywords…" autocomplete="off">
    </div>
    <div class="grow"></div>
    <button class="iconbtn" id="themeBtn" title="Light / dark theme" aria-label="Toggle theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
    <button class="iconbtn" id="syncBtn" title="Cloud sync status" aria-label="Sync">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 17.6A5 5 0 0 0 18 8h-1.3A7 7 0 1 0 6 17.7"/><path d="M12 12v9m0-9-3 3m3-3 3 3"/></svg>
    </button>
    <div class="avatar" id="avatarBtn" title="Account">?</div>
  </header>
  <aside class="sidebar">
    <nav class="nav" id="sideNav"></nav>
    <div class="plancard" id="planCard"></div>
    <div class="about" id="aboutLine"></div>
  </aside>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="tabbar" id="tabBar"></nav>
<div id="modalRoot"></div>
<div class="toast-wrap" id="toastRoot"></div>
<input type="file" id="fileInput" hidden>
<script type="module" src="app.js"></script>
<noscript><p style="padding:20px">IBI Product Listings Master needs JavaScript.</p></noscript>
</body>
</html>
